<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一週三練課表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF0F3;
  --card:#FFFFFF;
  --ink:#14202B;
  --muted:#5F6E7C;
  --line:#D6DDE3;
  --accent:#1F5AF0;
  --accent-ink:#FFFFFF;
  --done:#1F8A5B;
  --super:#FFF1CC;
  --super-ink:#7A5200;
  --tap:#F1F4F7;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161C; --card:#1A222B; --ink:#EEF2F5; --muted:#9AA7B3; --line:#2C3741;
    --accent:#5B8BFF; --accent-ink:#0B1220; --done:#3FBF84; --super:#3A2E10; --super-ink:#F2C766; --tap:#232D37;
  }
}
:root[data-theme="dark"]{
  --bg:#10161C; --card:#1A222B; --ink:#EEF2F5; --muted:#9AA7B3; --line:#2C3741;
  --accent:#5B8BFF; --accent-ink:#0B1220; --done:#3FBF84; --super:#3A2E10; --super-ink:#F2C766; --tap:#232D37;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 96px}

header{padding:20px 0 12px}
header h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.01em;line-height:1.15}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}

.seg{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;
  background:var(--line);border-radius:14px;margin-bottom:4px;
}
.seg button{
  border:0;border-radius:11px;background:transparent;color:var(--muted);
  padding:8px 6px;cursor:pointer;font:inherit;line-height:1.2;text-align:center;
}
.seg button b{display:block;font-size:15px;font-weight:800;color:inherit}
.seg button span{display:block;font-size:11px;margin-top:2px}
.seg button[aria-checked="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  padding:8px 0 10px;background:var(--bg);
}
.tab{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:10px 6px;text-align:left;cursor:pointer;
  font:inherit;line-height:1.2;
}
.tab .d{display:block;font-size:12px;color:var(--muted)}
.tab .n{display:block;font-size:15px;font-weight:700;margin-top:2px}
.tab .p{display:block;height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.tab .p i{display:block;height:100%;width:0;background:var(--done);transition:width .2s}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.day{display:none}
.day.on{display:block}
.meta{display:flex;justify-content:space-between;align-items:baseline;margin:10px 2px 8px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:700}

.ex{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:10px;
}
.ex.super{border-color:transparent;background:var(--super);padding:10px 12px}
.ex.super .row{background:var(--card);border-radius:10px;padding:10px 12px}
.ex.super .row + .row{margin-top:8px}
.ex.super .tag{font-size:12px;font-weight:700;color:var(--super-ink);margin:0 2px 8px}
.row{display:block}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.name{font-weight:700;font-size:17px}
.rm{color:var(--muted);font-size:14px;white-space:nowrap}
.rm b{color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin-top:2px}
.sets{display:flex;gap:8px;margin-top:10px}
.set{
  flex:1;height:44px;border-radius:10px;border:1px solid var(--line);
  background:var(--tap);color:var(--muted);font:inherit;font-size:15px;font-weight:700;cursor:pointer;
  transition:background .12s,color .12s;
}
.set[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:#fff}
.set:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.rest{
  font-size:12px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between
}
.rest button{
  border:0;background:none;color:var(--accent);font:inherit;font-size:12px;font-weight:700;padding:0;cursor:pointer
}

.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hbtn{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--accent);font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.wrow label{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:700;white-space:nowrap}
.wrow input{width:76px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--tap);color:var(--ink);font:inherit;font-size:16px;padding:0 8px;text-align:right}
.wrow input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.wrow .last{text-align:right}
.finish{margin-top:14px;width:100%;height:48px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.msg{font-size:13px;color:var(--done);margin:8px 2px 0;min-height:1.2em}
.hist{padding-top:8px}
.hbar{display:flex;gap:8px}
.hbar button,.hbar label{flex:1;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hrec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.hhead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;text-align:left;cursor:pointer;line-height:1.35}
.hhead b{font-size:16px}
.hc{color:var(--muted);white-space:nowrap}
.hbody{padding:0 14px 12px;border-top:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.hrow span:last-child{color:var(--muted);white-space:nowrap}
.hdel{margin-top:10px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:none;color:#C0392B;font:inherit;font-weight:700;cursor:pointer}
.empty{color:var(--muted);font-size:13px;margin:12px 2px}

.foot{margin:18px 2px 0;font-size:13px;color:var(--muted)}
.foot p{margin:6px 0}
.reset{
  margin-top:12px;width:100%;height:44px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer
}

.timer{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--accent);color:var(--accent-ink);
  display:none;align-items:center;justify-content:space-between;gap:12px;
  transform:translateY(100%);transition:transform .2s;
}
.timer.on{display:flex;transform:none}
.timer .t{font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1}
.timer .l{font-size:13px;opacity:.85}
.timer button{
  height:40px;padding:0 14px;border-radius:10px;border:0;font:inherit;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,.22);color:var(--accent-ink)
}
.timer .bar{position:absolute;left:0;top:0;height:3px;background:rgba(255,255,255,.7);width:100%;transform-origin:left;transition:transform 1s linear}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hd"><h1>一週三練</h1><button type="button" class="hbtn" id="hbtn">歷史紀錄</button></div>
    <p id="sub"></p>
  </header>

  <div id="train">
  <div class="seg" role="radiogroup" aria-label="課表" id="seg">
    <button type="button" role="radio" data-p="full"><b>全身</b><span>每天胸背腿都碰</span></button>
    <button type="button" role="radio" data-p="ppl"><b>PPL（推拉腿）</b><span>推、拉、腿各一天</span></button>
  </div>

  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="days"></div>

  <div class="foot">
    <p>RM（最大反覆次數）：8–10 RM 指這個重量最多只做得到 8–10 下。</p>
    <p>組間休息：複合動作 90–120 秒，單關節與超級組 60 秒。點一組會自動倒數。</p>
    <p id="tip"></p>
    <button class="finish" id="finish">完成訓練，存入紀錄</button>
    <div class="msg" id="fmsg"></div>
    <button class="reset" id="reset">清除今天的打勾（不存檔）</button>
  </div>
  </div>

  <section id="hist" class="hist" hidden>
    <div class="hbar">
      <button type="button" id="hexport">匯出備份</button>
      <label>匯入備份<input type="file" id="himport" accept="application/json,.json" hidden></label>
    </div>
    <div class="msg" id="hmsg"></div>
    <div id="hlist"></div>
    <p class="empty">紀錄存在這支手機的瀏覽器裡。換手機或清除瀏覽資料前，先按「匯出備份」把檔案存起來，再到新手機「匯入備份」。</p>
  </section>
</div>

<div class="timer" id="timer" aria-live="polite">
  <div class="bar" id="bar"></div>
  <div><div class="t" id="tt">1:30</div><div class="l" id="tl">組間休息</div></div>
  <div><button id="t30">+30 秒</button> <button id="tskip">結束</button></div>
</div>

<script>
const PROGRAMS={
 full:{
  sub:'全身式：每天 7 個動作、21 組，約 55–60 分鐘。隔天練（一三五或二四六）。',
  tip:'時間不夠時先砍超級組裡的單關節動作，複合動作照做。',
  key:'w3-checks-v1',
  days:[
   {name:'推為主＋腿前',ex:[
    {n:'哈克或史密斯深蹲',rm:'8–10',rest:120},
    {n:'平胸推',rm:'8–10',rest:120,note:'隔週換器械胸推 10–12'},
    {n:'滑輪下拉',rm:'10–12',rest:90,note:'可隔週換窄握下拉'},
    {n:'肩推',rm:'8–12',rest:90},
    {n:'腿前伸',rm:'12–15',rest:60},
    {sup:[{n:'側平舉',rm:'12–15'},{n:'Cable（滑輪）三頭下壓',rm:'12–15'}],rest:60},
    {n:'下腹',rm:'12–15',rest:60},
   ]},
   {name:'拉為主＋腿後',ex:[
    {n:'臀推機',rm:'8–12',rest:120},
    {n:'窄握划船',rm:'8–10',rest:120},
    {n:'上胸推',rm:'10–15',rest:90},
    {n:'腿後勾',rm:'10–15',rest:60},
    {n:'寬握划船',rm:'12–15',rest:60,note:'手肘夾角 45 度'},
    {sup:[{n:'二頭彎舉',rm:'12–15'},{n:'反向飛鳥',rm:'12–15'}],rest:60},
    {n:'下腹',rm:'10–15',rest:60},
   ]},
   {name:'胸背＋腿補強',ex:[
    {n:'腿推機',rm:'10–15',rest:120},
    {n:'大剪刀下拉',rm:'8–12',rest:90},
    {n:'高位划船',rm:'10–12',rest:90},
    {n:'分腿蹲',rm:'10–15',rest:90},
    {sup:[{n:'夾胸',rm:'12–15'},{n:'直臂下壓',rm:'12–15'}],rest:60},
    {sup:[{n:'髖內收',rm:'12–15'},{n:'髖外展',rm:'12–15'}],rest:60},
    {n:'下胸推或 Dip（雙槓撐體）',rm:'10–12',rest:90,note:'隔週交替，Dip 做 12–15'},
   ]},
  ]},
 ppl:{
  sub:'PPL（推拉腿）：推、拉、腿各一天，每個部位一週一次、單日量集中。推 21 組、拉與腿各 24 組。隔天練（一三五或二四六）。',
  tip:'拉日和腿日 24 組較緊，超級組休 60 秒要抓準。時間不夠先砍超級組裡的單關節動作。',
  key:'w3-ppl-checks-v1',
  days:[
   {name:'推：胸、肩、三頭',ex:[
    {n:'平胸推',rm:'8–10',rest:120,note:'隔週換器械胸推 10–12'},
    {n:'上胸推',rm:'10–15',rest:90},
    {n:'下胸推或 Dip（雙槓撐體）',rm:'10–12',rest:90,note:'隔週交替，Dip 做 12–15'},
    {n:'肩推',rm:'8–12',rest:90},
    {sup:[{n:'夾胸',rm:'12–15'},{n:'側平舉',rm:'12–15'}],rest:60},
    {n:'Cable（滑輪）三頭下壓',rm:'12–15',rest:60},
   ]},
   {name:'拉：背、二頭、肩後',ex:[
    {n:'大剪刀下拉',rm:'8–12',rest:120,note:'隔週換窄握下拉 8–12'},
    {n:'窄握划船',rm:'8–10',rest:120},
    {n:'滑輪下拉',rm:'10–12',rest:90},
    {n:'高位划船',rm:'10–12',rest:90},
    {n:'寬握划船',rm:'12–15',rest:60,note:'手肘夾角 45 度'},
    {sup:[{n:'直臂下壓',rm:'12–15'},{n:'反向飛鳥',rm:'12–15'}],rest:60},
    {n:'二頭彎舉',rm:'12–15',rest:60},
   ]},
   {name:'腿：前後、臀、核心',ex:[
    {n:'哈克或史密斯深蹲',rm:'10–12',rest:120,note:'隔週換腿推機 10–15'},
    {n:'臀推機',rm:'8–12',rest:120},
    {n:'分腿蹲',rm:'10–15',rest:90},
    {sup:[{n:'腿前伸',rm:'12–15'},{n:'腿後勾',rm:'10–15'}],rest:60},
    {sup:[{n:'髖內收',rm:'12–15'},{n:'髖外展',rm:'12–15'}],rest:60},
    {n:'下腹',rm:'12–15',rest:60},
   ]},
  ]},
};

let prog='full';
try{prog=localStorage.getItem('w3-prog')||'full'}catch(e){}
if(!PROGRAMS[prog])prog='full';
const PNAME={full:'全身',ppl:'PPL'};

const HKEY='w3-history-v1';
let history=[];
try{history=JSON.parse(localStorage.getItem(HKEY)||'[]')||[]}catch(e){history=[]}
if(!Array.isArray(history))history=[];
function saveHistory(){try{localStorage.setItem(HKEY,JSON.stringify(history))}catch(e){}}

let DAYS=[],KEY='',state={},weights={},cur=0;
function load(){
  DAYS=PROGRAMS[prog].days;KEY=PROGRAMS[prog].key;
  try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){state={}}
  try{weights=JSON.parse(localStorage.getItem(KEY+'-w')||'{}')||{}}catch(e){weights={}}
  try{cur=parseInt(localStorage.getItem('w3-day-'+prog)||'0',10)||0}catch(e){cur=0}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function saveW(){try{localStorage.setItem(KEY+'-w',JSON.stringify(weights))}catch(e){}}
function isOn(id){return !!state[id]}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function fdate(iso){
  const d=new Date(iso);const y=d.getFullYear();
  const t=(d.getMonth()+1)+'/'+d.getDate()+'（'+'日一二三四五六'[d.getDay()]+'）';
  return y!==new Date().getFullYear()?y+'/'+t:t;
}
function lastOf(name){
  for(let i=history.length-1;i>=0;i--){
    const it=(history[i].items||[]).find(x=>x.n===name);
    if(it&&(it.w!=null||it.sets))return {w:it.w,sets:it.sets,t:history[i].t};
  }
  return null;
}

const seg=document.getElementById('seg'),tabs=document.getElementById('tabs'),daysEl=document.getElementById('days');
const trainEl=document.getElementById('train'),histEl=document.getElementById('hist'),hbtn=document.getElementById('hbtn');
const fmsg=document.getElementById('fmsg'),hmsg=document.getElementById('hmsg');

let view='train';
hbtn.onclick=()=>{view=view==='train'?'hist':'train';renderView()};
function renderView(){
  trainEl.hidden=view!=='train';histEl.hidden=view!=='hist';
  hbtn.textContent=view==='train'?'歷史紀錄'+(history.length?'（'+history.length+'）':''):'回課表';
  if(view==='hist')renderHistory();
  window.scrollTo(0,0);
}

seg.querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{
    if(b.dataset.p===prog)return;
    prog=b.dataset.p;
    try{localStorage.setItem('w3-prog',prog)}catch(e){}
    stopTimer();fmsg.textContent='';build();
  };
});

function build(){
  load();
  seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked',b.dataset.p===prog));
  document.getElementById('sub').textContent=PROGRAMS[prog].sub;
  document.getElementById('tip').textContent=PROGRAMS[prog].tip;
  tabs.innerHTML='';daysEl.innerHTML='';

  DAYS.forEach((d,di)=>{
    const tb=document.createElement('button');
    tb.className='tab';tb.setAttribute('role','tab');tb.id='tab'+di;
    tb.innerHTML=`<span class="d">第 ${di+1} 天</span><span class="n">${d.name}</span><span class="p"><i id="p${di}"></i></span>`;
    tb.onclick=()=>show(di);
    tabs.appendChild(tb);

    const sec=document.createElement('section');sec.className='day';sec.id='day'+di;
    sec.setAttribute('role','tabpanel');
    const nm=d.ex.reduce((a,e)=>a+(e.sup?e.sup.length:1),0);
    sec.innerHTML=`<div class="meta"><span>${nm} 個動作 · ${nm*3} 組</span><span id="c${di}"></span></div>`;
    d.ex.forEach((e,ei)=>{
      const card=document.createElement('div');
      const items=e.sup||[e];
      card.className='ex'+(e.sup?' super':'');
      if(e.sup){const t=document.createElement('div');t.className='tag';t.textContent='超級組：兩個動作交替做，中間不休息';card.appendChild(t)}
      items.forEach((it,ii)=>{
        const wk=`${di}-${ei}-${ii}`;
        const last=lastOf(it.n);
        const lastTxt=last?('上次 '+(last.w!=null?last.w+' kg × ':'')+last.sets+' 組 · '+fdate(last.t)):'還沒有紀錄';
        const row=document.createElement('div');row.className='row';
        row.innerHTML=`<div class="top"><span class="name">${it.n}</span><span class="rm"><b>${it.rm}</b> RM · 3 組</span></div>`
          +(it.note||e.note?`<div class="note">${it.note||e.note}</div>`:'')
          +`<div class="wrow"><label><input type="number" inputmode="decimal" step="0.5" min="0" placeholder="${last&&last.w!=null?last.w:'重量'}" value="${weights[wk]!=null?weights[wk]:''}" aria-label="${it.n} 重量"> kg</label><span class="last">${lastTxt}</span></div>`
          +`<div class="sets"></div>`;
        const inp=row.querySelector('input');
        inp.oninput=()=>{const v=parseFloat(inp.value);if(isNaN(v))delete weights[wk];else weights[wk]=v;saveW()};
        const sets=row.querySelector('.sets');
        for(let s=1;s<=3;s++){
          const id=`${wk}-${s}`;
          const b=document.createElement('button');b.className='set';b.textContent='第 '+s+' 組';
          b.setAttribute('aria-pressed',isOn(id));
          b.onclick=()=>{
            const on=!isOn(id);state[id]=on;if(!on)delete state[id];save();
            b.setAttribute('aria-pressed',on);progress(di);
            if(on)startTimer(e.rest);
          };
          sets.appendChild(b);
        }
        card.appendChild(row);
      });
      const r=document.createElement('div');r.className='rest';
      r.innerHTML=`<span>休息 ${fmt(e.rest)}</span><button type="button">手動計時</button>`;
      r.querySelector('button').onclick=()=>startTimer(e.rest);
      card.appendChild(r);
      sec.appendChild(card);
    });
    daysEl.appendChild(sec);
    progress(di);
  });
  show(Math.min(cur,DAYS.length-1));
}

function progress(di){
  const total=DAYS[di].ex.reduce((a,e)=>a+((e.sup?e.sup.length:1)*3),0);
  let done=0;for(const k in state)if(k.startsWith(di+'-'))done++;
  document.getElementById('p'+di).style.width=(done/total*100)+'%';
  document.getElementById('c'+di).innerHTML=`已完成 <b>${done}</b> / ${total} 組`;
}
function show(di){
  cur=di;
  document.querySelectorAll('.tab').forEach((t,i)=>t.setAttribute('aria-selected',i===di));
  document.querySelectorAll('.day').forEach((s,i)=>s.classList.toggle('on',i===di));
  try{localStorage.setItem('w3-day-'+prog,di)}catch(e){}
}

document.getElementById('finish').onclick=()=>{
  const d=DAYS[cur];const items=[];let done=0,total=0;
  d.ex.forEach((e,ei)=>{(e.sup||[e]).forEach((it,ii)=>{
    let n=0;for(let s=1;s<=3;s++)if(isOn(`${cur}-${ei}-${ii}-${s}`))n++;
    total+=3;done+=n;const w=weights[`${cur}-${ei}-${ii}`];
    if(n>0)items.push({n:it.n,rm:it.rm,sets:n,w:w!=null?w:null});
  })});
  if(done===0){fmsg.textContent='今天還沒打勾，先做完再存。';return}
  history.push({id:Date.now(),t:new Date().toISOString(),prog,day:cur,name:d.name,done,total,items});
  saveHistory();
  for(const k in state)if(k.startsWith(cur+'-'))delete state[k];save();
  stopTimer();build();
  fmsg.textContent='已存入：'+fdate(new Date().toISOString())+' '+d.name+'，'+done+'/'+total+' 組。打勾已清空，重量保留。';
  hbtn.textContent='歷史紀錄（'+history.length+'）';
};

document.getElementById('reset').onclick=()=>{
  for(const k in state)if(k.startsWith(cur+'-'))delete state[k];
  save();
  document.querySelectorAll('#day'+cur+' .set').forEach(b=>b.setAttribute('aria-pressed','false'));
  progress(cur);fmsg.textContent='';
};

function renderHistory(){
  const list=document.getElementById('hlist');list.innerHTML='';
  if(!history.length){list.innerHTML='<p class="empty">還沒有紀錄。練完在課表頁按「完成訓練，存入紀錄」。</p>';return}
  history.slice().sort((a,b)=>b.t<a.t?-1:1).forEach(r=>{
    const el=document.createElement('div');el.className='hrec';
    const rows=(r.items||[]).map(it=>`<div class="hrow"><span>${it.n}</span><span>${it.w!=null?it.w+' kg × ':''}${it.sets} 組</span></div>`).join('');
    el.innerHTML=`<button class="hhead" type="button"><span><b>${fdate(r.t)}</b><br>${PNAME[r.prog]||r.prog} · 第 ${r.day+1} 天 ${r.name}</span><span class="hc">${r.done}/${r.total} 組</span></button>`
      +`<div class="hbody" hidden>${rows}<button class="hdel" type="button">刪除這筆</button></div>`;
    const body=el.querySelector('.hbody');
    el.querySelector('.hhead').onclick=()=>{body.hidden=!body.hidden};
    const del=el.querySelector('.hdel');let armed=false;
    del.onclick=()=>{
      if(!armed){armed=true;del.textContent='再按一次確認刪除';return}
      history=history.filter(x=>x.id!==r.id);saveHistory();renderHistory();
      hbtn.textContent='回課表';
    };
    list.appendChild(el);
  });
}
document.getElementById('hexport').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'w3',v:1,history},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='訓練紀錄-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  hmsg.textContent='已匯出 '+history.length+' 筆。';
};
document.getElementById('himport').onchange=ev=>{
  const f=ev.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const j=JSON.parse(rd.result);const arr=Array.isArray(j)?j:(j.history||[]);
      const ids=new Set(history.map(x=>x.id));let n=0;
      arr.forEach(r=>{if(r&&r.id&&r.t&&Array.isArray(r.items)&&!ids.has(r.id)){history.push(r);n++}});
      saveHistory();renderHistory();hmsg.textContent='匯入 '+n+' 筆新紀錄，重複的略過。';
    }catch(e){hmsg.textContent='檔案讀不出來，請確認是這個頁面匯出的備份檔。'}
    ev.target.value='';
  };
  rd.readAsText(f);
};

// rest timer
const timer=document.getElementById('timer'),tt=document.getElementById('tt'),bar=document.getElementById('bar');
let left=0,total=0,iv=null;
function render(){tt.textContent=fmt(left);bar.style.transform='scaleX('+(total?left/total:0)+')'}
function startTimer(sec){
  clearInterval(iv);left=sec;total=sec;timer.classList.add('on');render();
  iv=setInterval(()=>{left--;if(left<=0){stopTimer();if(navigator.vibrate)try{navigator.vibrate([200,100,200])}catch(e){}}else render()},1000);
}
function stopTimer(){clearInterval(iv);iv=null;timer.classList.remove('on')}
document.getElementById('t30').onclick=()=>{left+=30;total=Math.max(total,left);render()};
document.getElementById('tskip').onclick=stopTimer;

build();renderView();
</script>
</body>
