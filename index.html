<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEEF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141619" media="(prefers-color-scheme: dark)">
<title>一週三練課表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#EDEEF0; --card:#FFFFFF; --ink:#12161B; --ink2:#3A424B; --muted:#6B7480; --line:#D3D7DC; --line2:#E6E9EC;
  --yellow:#FFCB05; --yellow-ink:#12161B; --done:#12161B; --done-ink:#FFFFFF; --danger:#C2410C;
  --tap:#F4F5F7;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141619; --card:#1C2025; --ink:#F2F4F6; --ink2:#C9CFD6; --muted:#8B94A0; --line:#30363D; --line2:#262B31;
    --yellow:#FFCB05; --yellow-ink:#12161B; --done:#F2F4F6; --done-ink:#12161B; --danger:#F97316; --tap:#22272D;
  }
}
:root[data-theme="dark"]{
  --bg:#141619; --card:#1C2025; --ink:#F2F4F6; --ink2:#C9CFD6; --muted:#8B94A0; --line:#30363D; --line2:#262B31;
  --yellow:#FFCB05; --yellow-ink:#12161B; --done:#F2F4F6; --done-ink:#12161B; --danger:#F97316; --tap:#22272D;
}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
}
.num{font-family:"Barlow Condensed","Noto Sans TC",sans-serif;font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 120px}

/* header */
.top{padding:18px 0 0}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:34px;font-weight:900;line-height:1;letter-spacing:-.02em}
.hbtn{height:36px;padding:0 12px;border-radius:8px;border:1.5px solid var(--ink);background:transparent;font-weight:700;white-space:nowrap}
.prog{display:flex;gap:22px;margin-top:14px;border-bottom:1.5px solid var(--line)}
.prog button{border:0;background:none;padding:6px 0 10px;color:var(--muted);font-weight:700;font-size:16px;position:relative}
.prog button[aria-checked="true"]{color:var(--ink)}
.prog button[aria-checked="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1.5px;height:3px;background:var(--yellow)}
.sub{margin:10px 0 0;font-size:14px;color:var(--muted)}

.auth{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.auth .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth .who b{color:var(--ink)}
.auth button{height:36px;padding:0 12px;border-radius:8px;border:1.5px solid var(--ink);background:var(--card);font-weight:700;font-size:13px;white-space:nowrap}
.auth button.lnk{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.auth .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.auth .dot.ok{background:#16A34A}.auth .dot.busy{background:var(--yellow)}.auth .dot.err{background:var(--danger)}

/* day tabs */
.tabs{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  display:grid;grid-template-columns:repeat(3,1fr);
  margin:14px -16px 0;padding:0 16px;background:var(--bg);
  border-bottom:1.5px solid var(--line);
}
.tab{border:0;background:none;padding:10px 4px 10px;text-align:left;position:relative;color:var(--muted);display:flex;gap:8px;align-items:flex-start;min-width:0}
.tab .n{font-size:30px;line-height:1}
.tab .t{display:block;font-size:13px;line-height:1.25;padding-top:3px;min-width:0}
.tab .t b{display:block;color:inherit;font-weight:700}
.tab .t small{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:8px;bottom:-1.5px;height:3px;background:var(--yellow)}

/* exercise list */
.day{display:none}.day.on{display:block}
.meta{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 6px;font-size:14px;color:var(--muted)}
.meta .num{font-size:22px;color:var(--ink)}
.ex{padding:14px 0 16px;border-bottom:1.5px solid var(--line2)}
.ex:last-child{border-bottom:0}
.exh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.name{font-size:18px;font-weight:700;line-height:1.3}
.mus{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.rm{text-align:right;white-space:nowrap;line-height:1}
.rm .num{font-size:26px}
.rm small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.note{font-size:13px;color:var(--ink2);margin-top:6px}
.swapped{font-size:13px;color:var(--ink2);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swapped button{border:0;background:none;padding:0;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.wrow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.wrow label{display:flex;align-items:center;gap:6px;color:var(--ink);white-space:nowrap}
.wrow input{width:78px;height:40px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;padding:0 8px;text-align:right;-moz-appearance:textfield}
.wrow input::-webkit-outer-spin-button,.wrow input::-webkit-inner-spin-button{-webkit-appearance:none}
.wrow .last{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swapbtn{height:32px;padding:0 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:700;white-space:nowrap}
.swapbtn[aria-expanded="true"]{border-color:var(--ink)}

.sets{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card)}
.set{height:50px;border:0;background:transparent;color:var(--ink);display:flex;align-items:baseline;justify-content:center;gap:2px;transition:background .1s}
.set + .set{border-left:1.5px solid var(--ink)}
.set .num{font-size:24px}
.set small{font-size:12px;color:var(--muted)}
.set[aria-pressed="true"]{background:var(--done);color:var(--done-ink)}
.set[aria-pressed="true"] small{color:inherit;opacity:.7}
.rest{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.rest button{border:0;background:none;padding:0;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* superset group */
.super{position:relative;padding-left:14px;margin:4px 0}
.super::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:2px;background:var(--yellow)}
.super .tag{font-size:13px;color:var(--ink2);padding:12px 0 0;font-weight:700}
.super .ex{border-bottom-color:var(--line2)}
.super .ex:last-child{border-bottom:0}

/* alternatives */
.alts{margin-top:12px;padding:12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--card)}
.alts h4{margin:0 0 2px;font-size:14px}
.alts p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.alt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 0;border:0;border-top:1.5px solid var(--line2);background:none}
.altw{border-top:1.5px solid var(--line2);position:relative}
.altw:first-of-type{border-top:0}
.altw .alt{border-top:0;padding-right:64px}
.altw .src{position:absolute;right:0;top:12px;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.alt b{display:block;font-size:16px}
.alt span{display:block;font-size:13px;color:var(--muted)}
.alt .num{font-size:22px;white-space:nowrap}
.alt .num small{font-size:11px;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-weight:400}
.alt[aria-pressed="true"] b::before{content:"✓ ";color:var(--ink)}
.alts .close{margin-top:6px;width:100%;height:36px;border-radius:8px;border:1.5px solid var(--line);background:none;font-weight:700;font-size:13px}

/* footer actions */
.foot{margin-top:20px;font-size:13px;color:var(--muted)}
.foot p{margin:6px 0}
.finish{margin-top:10px;width:100%;height:54px;border-radius:12px;border:0;background:var(--yellow);color:var(--yellow-ink);font-size:17px;font-weight:900}
.msg{font-size:13px;color:var(--ink);margin:8px 2px 0;min-height:1.2em}
.reset{margin-top:8px;width:100%;height:44px;border-radius:12px;border:1.5px solid var(--line);background:none;color:var(--ink2);font-weight:700}

/* history */
.hist{padding-top:14px}
.hbar{display:flex;gap:8px}
.hbar button,.hbar label{flex:1;height:44px;border-radius:10px;border:1.5px solid var(--ink);background:none;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hrec{border-bottom:1.5px solid var(--line2)}
.hhead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border:0;background:none;text-align:left;line-height:1.3}
.hhead .d{font-size:26px;line-height:1}
.hhead .w{font-size:14px;color:var(--ink2);margin-top:2px}
.hhead .hc{font-size:22px;white-space:nowrap}
.hhead .hc small{font-size:12px;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-weight:400}
.hbody{padding:0 0 14px}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1.5px solid var(--line2);font-size:15px}
.hrow span:last-child{color:var(--muted);white-space:nowrap}
.hdel{margin-top:10px;height:36px;padding:0 12px;border-radius:8px;border:1.5px solid var(--line);background:none;color:var(--danger);font-weight:700;font-size:13px}
.empty{color:var(--muted);font-size:13px;margin:14px 2px}

/* rest timer */
.timer{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));
  background:#12161B;color:#FFCB05;
  display:none;align-items:center;justify-content:space-between;gap:12px;
}
.timer.on{display:flex}
.timer .t{font-size:52px;line-height:.9}
.timer .l{font-size:13px;color:#C9CFD6;margin-top:4px}
.timer button{height:44px;padding:0 16px;border-radius:10px;border:1.5px solid #FFCB05;background:transparent;color:#FFCB05;font-weight:700}
.timer button.stop{background:#FFCB05;color:#12161B}
.timer .bar{position:absolute;left:0;top:0;height:4px;background:#FFCB05;width:100%;transform-origin:left;transition:transform 1s linear}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>一週三練</h1><button type="button" class="hbtn" id="hbtn">歷史紀錄</button></div>
    <div class="prog" role="radiogroup" aria-label="課表" id="seg">
      <button type="button" role="radio" data-p="full">全身</button>
      <button type="button" role="radio" data-p="ppl">PPL（推拉腿）</button>
    </div>
    <p class="sub" id="sub"></p>
    <div class="auth" id="auth" hidden></div>
  </header>

  <div id="train">
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div id="days"></div>

    <div class="foot">
      <p id="tip"></p>
      <p>RM（最大反覆次數）：8–10 RM 指這個重量最多只做得到 8–10 下。組間休息：複合動作 90–120 秒，單關節與超級組 60 秒，點一組會自動倒數。</p>
      <p>器材被佔走時，按「換動作」挑一個練同樣肌群的替代動作，紀錄會存替代後的名稱。</p>
      <button class="finish" id="finish">完成訓練，存入紀錄</button>
      <div class="msg" id="fmsg"></div>
      <button class="reset" id="reset">清除今天的打勾（不存檔）</button>
    </div>
  </div>

  <section id="hist" class="hist" hidden>
    <div class="hbar">
      <button type="button" id="hexport">匯出備份</button>
      <label>匯入備份<input type="file" id="himport" accept="application/json,.json" hidden></label>
    </div>
    <div class="msg" id="hmsg"></div>
    <div id="hlist"></div>
    <p class="empty">沒登入時，紀錄只存在這支手機的瀏覽器裡；用 Google 或 Apple 登入後會同步到雲端，換手機登入同一個帳號就會看到。「匯出備份」仍可當離線備份。</p>
  </section>
</div>

<div class="timer" id="timer" aria-live="polite">
  <div class="bar" id="bar"></div>
  <div><div class="t num" id="tt">1:30</div><div class="l">組間休息</div></div>
  <div><button type="button" id="t30">+30 秒</button> <button type="button" class="stop" id="tskip">結束</button></div>
</div>

<script>
const PROGRAMS={
 full:{
  sub:'全身式：每天 7 個動作、21 組，約 55–60 分鐘。隔天練（一三五或二四六）。',
  tip:'時間不夠時先砍超級組裡的單關節動作，複合動作照做。',
  key:'w3-checks-v1',
  days:[
   {name:'推為主＋腿前',ex:[
    {n:'哈克或史密斯深蹲',rm:'8–10',rest:120},
    {n:'平胸推',rm:'8–10',rest:120,note:'隔週換器械胸推 10–12'},
    {n:'滑輪下拉',rm:'10–12',rest:90,note:'可隔週換窄握下拉'},
    {n:'肩推',rm:'8–12',rest:90},
    {n:'腿前伸',rm:'12–15',rest:60},
    {sup:[{n:'側平舉',rm:'12–15'},{n:'Cable（滑輪）三頭下壓',rm:'12–15'}],rest:60},
    {n:'下腹',rm:'12–15',rest:60},
   ]},
   {name:'拉為主＋腿後',ex:[
    {n:'臀推機',rm:'8–12',rest:120},
    {n:'窄握划船',rm:'8–10',rest:120},
    {n:'上胸推',rm:'10–15',rest:90},
    {n:'腿後勾',rm:'10–15',rest:60},
    {n:'寬握划船',rm:'12–15',rest:60,note:'手肘夾角 45 度'},
    {sup:[{n:'二頭彎舉',rm:'12–15'},{n:'反向飛鳥',rm:'12–15'}],rest:60},
    {n:'下腹',rm:'10–15',rest:60},
   ]},
   {name:'胸背＋腿補強',ex:[
    {n:'腿推機',rm:'10–15',rest:120},
    {n:'大剪刀下拉',rm:'8–12',rest:90},
    {n:'高位划船',rm:'10–12',rest:90},
    {n:'分腿蹲',rm:'10–15',rest:90},
    {sup:[{n:'夾胸',rm:'12–15'},{n:'直臂下壓',rm:'12–15'}],rest:60},
    {sup:[{n:'髖內收',rm:'12–15'},{n:'髖外展',rm:'12–15'}],rest:60},
    {n:'下胸推或 Dip（雙槓撐體）',rm:'10–12',rest:90,note:'隔週交替，Dip 做 12–15'},
   ]},
  ]},
 ppl:{
  sub:'PPL（推拉腿）：推、拉、腿各一天，每個部位一週一次、單日量集中。推 21 組、拉與腿各 24 組。隔天練（一三五或二四六）。',
  tip:'拉日和腿日 24 組較緊，超級組休 60 秒要抓準。時間不夠先砍超級組裡的單關節動作。',
  key:'w3-ppl-checks-v1',
  days:[
   {name:'推：胸、肩、三頭',ex:[
    {n:'平胸推',rm:'8–10',rest:120,note:'隔週換器械胸推 10–12'},
    {n:'上胸推',rm:'10–15',rest:90},
    {n:'下胸推或 Dip（雙槓撐體）',rm:'10–12',rest:90,note:'隔週交替，Dip 做 12–15'},
    {n:'肩推',rm:'8–12',rest:90},
    {sup:[{n:'夾胸',rm:'12–15'},{n:'側平舉',rm:'12–15'}],rest:60},
    {n:'Cable（滑輪）三頭下壓',rm:'12–15',rest:60},
   ]},
   {name:'拉：背、二頭、肩後',ex:[
    {n:'大剪刀下拉',rm:'8–12',rest:120,note:'隔週換窄握下拉 8–12'},
    {n:'窄握划船',rm:'8–10',rest:120},
    {n:'滑輪下拉',rm:'10–12',rest:90},
    {n:'高位划船',rm:'10–12',rest:90},
    {n:'寬握划船',rm:'12–15',rest:60,note:'手肘夾角 45 度'},
    {sup:[{n:'直臂下壓',rm:'12–15'},{n:'反向飛鳥',rm:'12–15'}],rest:60},
    {n:'二頭彎舉',rm:'12–15',rest:60},
   ]},
   {name:'腿：前後、臀、核心',ex:[
    {n:'哈克或史密斯深蹲',rm:'10–12',rest:120,note:'隔週換腿推機 10–15'},
    {n:'臀推機',rm:'8–12',rest:120},
    {n:'分腿蹲',rm:'10–15',rest:90},
    {sup:[{n:'腿前伸',rm:'12–15'},{n:'腿後勾',rm:'10–15'}],rest:60},
    {sup:[{n:'髖內收',rm:'12–15'},{n:'髖外展',rm:'12–15'}],rest:60},
    {n:'下腹',rm:'12–15',rest:60},
   ]},
  ]},
};


// 替代動作：同肌群、同動作模式。每筆附資料來源。
const ALTS={
 '哈克或史密斯深蹲':{m:'股四頭肌、臀大肌、內收肌群',alts:[
  {n:'腿推機（Leg Press）',note:'腳放低一點偏股四頭，活動度比哈克蹲小',src:'https://barbend.com/hack-squat-machine/'},
  {n:'槓鈴深蹲（Barbell Back Squat）',note:'需自行穩定，核心參與較多',src:'https://www.strengthlog.com/hack-squat-machine/'},
  {n:'前蹲（Front Squat）',note:'軀幹直立，角度最接近哈克蹲',src:'https://www.strengthlog.com/hack-squat-machine/'},
 ]},
 '平胸推':{m:'胸大肌（中胸）、前三角肌、肱三頭肌',alts:[
  {n:'啞鈴臥推（Dumbbell Bench Press）',note:'兩側獨立，可修正左右不平衡',src:'https://www.strengthlog.com/bench-press-alternatives/'},
  {n:'史密斯臥推（Smith Machine Bench Press）',note:'軌道固定，一個人也能安全推重',src:'https://www.strengthlog.com/bench-press-alternatives/'},
  {n:'繩索胸推（Cable Chest Press）',rm:'10–12',note:'全程張力不中斷',src:'https://www.strengthlog.com/bench-press-alternatives/'},
 ]},
 '上胸推':{m:'上胸（胸大肌鎖骨部）、前三角肌、肱三頭肌',alts:[
  {n:'上斜啞鈴臥推（Incline Dumbbell Press）',note:'椅背約 30–45 度',src:'https://www.strengthlog.com/dumbbell-incline-press/'},
  {n:'史密斯上斜臥推（Smith Machine Incline Press）',note:'軌道固定，適合穩定推重',src:'https://www.strengthlog.com/smith-machine-incline-bench-press/'},
  {n:'器械上斜胸推（Incline Chest Press Machine）',note:'部分胸推機椅背可調成上斜',src:'https://www.strengthlog.com/machine-chest-press/'},
 ]},

let prog='full';
try{prog=localStorage.getItem('w3-prog')||'full'}catch(e){}
if(!PROGRAMS[prog])prog='full';
const PNAME={full:'全身',ppl:'PPL'};

const HKEY='w3-history-v1';
let history=[];
try{history=JSON.parse(localStorage.getItem(HKEY)||'[]')||[]}catch(e){history=[]}
if(!Array.isArray(history))history=[];
function saveHistory(){try{localStorage.setItem(HKEY,JSON.stringify(history))}catch(e){}}

let DAYS=[],KEY='',state={},weights={},swaps={},cur=0;
function load(){
  DAYS=PROGRAMS[prog].days;KEY=PROGRAMS[prog].key;
  try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){state={}}
  try{weights=JSON.parse(localStorage.getItem(KEY+'-w')||'{}')||{}}catch(e){weights={}}
  try{swaps=JSON.parse(localStorage.getItem(KEY+'-swap')||'{}')||{}}catch(e){swaps={}}
  try{cur=parseInt(localStorage.getItem('w3-day-'+prog)||'0',10)||0}catch(e){cur=0}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function saveW(){try{localStorage.setItem(KEY+'-w',JSON.stringify(weights))}catch(e){};pushPrefs()}
function saveS(){try{localStorage.setItem(KEY+'-swap',JSON.stringify(swaps))}catch(e){};pushPrefs()}
function isOn(id){return !!state[id]}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function fdate(iso){
  const d=new Date(iso);const y=d.getFullYear();
  const t=(d.getMonth()+1)+'/'+d.getDate()+'（'+'日一二三四五六'[d.getDay()]+'）';
  return y!==new Date().getFullYear()?y+'/'+t:t;
}
function lastOf(name){
  for(let i=history.length-1;i>=0;i--){
    const it=(history[i].items||[]).find(x=>x.n===name);
    if(it&&(it.w!=null||it.sets))return {w:it.w,sets:it.sets,t:history[i].t};
  }
  return null;
}
// 目前這一格實際要做的動作（原動作或替代動作）
function effective(it,wk){
  const a=ALTS[it.n];const s=swaps[wk];
  if(a&&s!=null&&a.alts[s])return {n:a.alts[s].n,rm:a.alts[s].rm||it.rm,note:a.alts[s].note||'',orig:it.n,mus:a.m};
  return {n:it.n,rm:it.rm,note:'',orig:null,mus:a?a.m:''};
}

const seg=document.getElementById('seg'),tabs=document.getElementById('tabs'),daysEl=document.getElementById('days');
const trainEl=document.getElementById('train'),histEl=document.getElementById('hist'),hbtn=document.getElementById('hbtn');
const fmsg=document.getElementById('fmsg'),hmsg=document.getElementById('hmsg');

let view='train';
hbtn.onclick=()=>{view=view==='train'?'hist':'train';renderView()};
function renderView(){
  trainEl.hidden=view!=='train';histEl.hidden=view!=='hist';
  seg.hidden=view!=='train';document.getElementById('sub').hidden=view!=='train';
  hbtn.textContent=view==='train'?'歷史紀錄'+(history.length?' '+history.length:''):'回課表';
  if(view==='hist')renderHistory();
  window.scrollTo(0,0);
}

seg.querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{
    if(b.dataset.p===prog)return;
    prog=b.dataset.p;
    try{localStorage.setItem('w3-prog',prog)}catch(e){}
    stopTimer();fmsg.textContent='';build();pushPrefs();
  };
});

function build(){
  load();
  seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked',b.dataset.p===prog));
  document.getElementById('sub').textContent=PROGRAMS[prog].sub;
  document.getElementById('tip').textContent=PROGRAMS[prog].tip;
  tabs.innerHTML='';daysEl.innerHTML='';

  DAYS.forEach((d,di)=>{
    const tb=document.createElement('button');
    tb.className='tab';tb.setAttribute('role','tab');tb.id='tab'+di;
    tb.innerHTML=`<span class="n num">${di+1}</span><span class="t"><b>${d.name}</b><small id="p${di}"></small></span>`;
    tb.onclick=()=>show(di);
    tabs.appendChild(tb);

    const sec=document.createElement('section');sec.className='day';sec.id='day'+di;
    sec.setAttribute('role','tabpanel');
    const nm=d.ex.reduce((a,e)=>a+(e.sup?e.sup.length:1),0);
    sec.innerHTML=`<div class="meta"><span>${nm} 個動作，${nm*3} 組</span><span id="c${di}"></span></div>`;
    d.ex.forEach((e,ei)=>{
      const items=e.sup||[e];
      let holder=sec;
      if(e.sup){
        holder=document.createElement('div');holder.className='super';
        holder.innerHTML='<div class="tag">超級組：兩個交替做，中間不休息</div>';
        sec.appendChild(holder);
      }
      items.forEach((it,ii)=>{
        const wk=`${di}-${ei}-${ii}`;
        holder.appendChild(renderEx(it,e,wk,di));
      });
      if(!e.sup){/* rest line is inside renderEx */}
    });
    daysEl.appendChild(sec);
    progress(di);
  });
  show(Math.min(cur,DAYS.length-1));
}

function renderEx(it,e,wk,di){
  const ef=effective(it,wk);
  const last=lastOf(ef.n);
  const lastTxt=last?('上次 '+(last.w!=null?last.w+' kg × ':'')+last.sets+' 組，'+fdate(last.t)):'還沒有紀錄';
  const note=ef.note||it.note||e.note||'';
  const art=document.createElement('article');art.className='ex';
  art.innerHTML=
    `<div class="exh"><div><span class="name">${ef.n}</span>${ef.mus?`<span class="mus">${ef.mus}</span>`:''}</div>`+
    `<div class="rm"><span class="num">${ef.rm}</span><small>RM × 3 組</small></div></div>`+
    (note?`<div class="note">${note}</div>`:'')+
    (ef.orig?`<div class="swapped">代替「${ef.orig}」<button type="button" class="unswap">換回原動作</button></div>`:'')+
    `<div class="wrow"><label><input type="number" inputmode="decimal" step="0.5" min="0" placeholder="${last&&last.w!=null?last.w:'—'}" value="${weights[wk]!=null?weights[wk]:''}" aria-label="${ef.n} 重量"><span>kg</span></label>`+
    `<span class="last">${lastTxt}</span>`+
    (ALTS[it.n]?`<button type="button" class="swapbtn" aria-expanded="false">換動作</button>`:'')+`</div>`+
    `<div class="sets"></div>`+
    `<div class="rest"><span>休息 ${fmt(e.rest)}</span><button type="button">手動計時</button></div>`;
  const inp=art.querySelector('input');
  inp.oninput=()=>{const v=parseFloat(inp.value);if(isNaN(v))delete weights[wk];else weights[wk]=v;saveW()};
  const sets=art.querySelector('.sets');
  for(let s=1;s<=3;s++){
    const id=`${wk}-${s}`;
    const b=document.createElement('button');b.type='button';b.className='set';
    b.innerHTML=`<span class="num">${s}</span><small>組</small>`;
    b.setAttribute('aria-pressed',isOn(id));
    b.onclick=()=>{
      const on=!isOn(id);state[id]=on;if(!on)delete state[id];save();
      b.setAttribute('aria-pressed',on);progress(di);
      if(on)startTimer(e.rest);
    };
    sets.appendChild(b);
  }
  art.querySelector('.rest button').onclick=()=>startTimer(e.rest);
  const un=art.querySelector('.unswap');
  if(un)un.onclick=()=>{delete swaps[wk];saveS();art.replaceWith(renderEx(it,e,wk,di))};
  const sb=art.querySelector('.swapbtn');
  if(sb)sb.onclick=()=>{
    const open=art.querySelector('.alts');
    if(open){open.remove();sb.setAttribute('aria-expanded','false');return}
    sb.setAttribute('aria-expanded','true');
    const a=ALTS[it.n];
    const box=document.createElement('div');box.className='alts';
    box.innerHTML=`<h4>器材被佔？換一個練同樣肌群的</h4><p>${a.m}</p>`;
    a.alts.forEach((alt,idx)=>{
      const b=document.createElement('button');b.type='button';b.className='alt';
      b.setAttribute('aria-pressed',swaps[wk]===idx);
      b.innerHTML=`<div><b>${alt.n}</b>${alt.note?`<span>${alt.note}</span>`:''}</div><span class="num">${alt.rm||it.rm}<small> RM</small></span>`;
      b.onclick=()=>{swaps[wk]=idx;saveS();art.replaceWith(renderEx(it,e,wk,di))};
      const wrapEl=document.createElement('div');wrapEl.className='altw';
      wrapEl.appendChild(b);
      if(alt.src){const l=document.createElement('a');l.className='src';l.href=alt.src;l.target='_blank';l.rel='noopener';l.textContent='資料來源';wrapEl.appendChild(l)}
      box.appendChild(wrapEl);
    });
    const c=document.createElement('button');c.type='button';c.className='close';c.textContent='收起';
    c.onclick=()=>{box.remove();sb.setAttribute('aria-expanded','false')};
    box.appendChild(c);
    art.appendChild(box);
  };
  return art;
}

function progress(di){
  const total=DAYS[di].ex.reduce((a,e)=>a+((e.sup?e.sup.length:1)*3),0);
  let done=0;for(const k in state)if(k.startsWith(di+'-'))done++;
  document.getElementById('p'+di).textContent=done?done+' / '+total+' 組':'';
  document.getElementById('c'+di).innerHTML=`<span class="num">${done}</span> / ${total} 組完成`;
}
function show(di){
  cur=di;
  document.querySelectorAll('.tab').forEach((t,i)=>t.setAttribute('aria-selected',i===di));
  document.querySelectorAll('.day').forEach((s,i)=>s.classList.toggle('on',i===di));
  try{localStorage.setItem('w3-day-'+prog,di)}catch(e){}
}

document.getElementById('finish').onclick=()=>{
  const d=DAYS[cur];const items=[];let done=0,total=0;
  d.ex.forEach((e,ei)=>{(e.sup||[e]).forEach((it,ii)=>{
    const wk=`${cur}-${ei}-${ii}`;const ef=effective(it,wk);
    let n=0;for(let s=1;s<=3;s++)if(isOn(`${wk}-${s}`))n++;
    total+=3;done+=n;const w=weights[wk];
    if(n>0)items.push({n:ef.n,orig:ef.orig,rm:ef.rm,sets:n,w:w!=null?w:null});
  })});
  if(done===0){fmsg.textContent='今天還沒打勾，先做完再存。';return}
  const rec={id:Date.now(),t:new Date().toISOString(),prog,day:cur,name:d.name,done,total,items};
  history.push(rec);saveHistory();pushSession(rec);
  for(const k in state)if(k.startsWith(cur+'-'))delete state[k];save();
  stopTimer();build();
  fmsg.textContent='已存入 '+fdate(new Date().toISOString())+' '+d.name+'，'+done+'/'+total+' 組。打勾已清空，重量和替代動作都保留。';
  hbtn.textContent='歷史紀錄 '+history.length;
};

document.getElementById('reset').onclick=()=>{
  for(const k in state)if(k.startsWith(cur+'-'))delete state[k];
  save();
  document.querySelectorAll('#day'+cur+' .set').forEach(b=>b.setAttribute('aria-pressed','false'));
  progress(cur);fmsg.textContent='';
};

function renderHistory(){
  const list=document.getElementById('hlist');list.innerHTML='';
  if(!history.length){list.innerHTML='<p class="empty">還沒有紀錄。練完在課表頁按「完成訓練，存入紀錄」，這裡就會出現。</p>';return}
  history.slice().sort((a,b)=>b.t<a.t?-1:1).forEach(r=>{
    const el=document.createElement('div');el.className='hrec';
    const rows=(r.items||[]).map(it=>`<div class="hrow"><span>${it.n}${it.orig?`<small style="color:var(--muted)">（代替${it.orig}）</small>`:''}</span><span>${it.w!=null?it.w+' kg × ':''}${it.sets} 組</span></div>`).join('');
    el.innerHTML=`<button class="hhead" type="button"><div><div class="d num">${fdate(r.t)}</div><div class="w">${PNAME[r.prog]||r.prog}，第 ${r.day+1} 天 ${r.name}</div></div><span class="hc num">${r.done}<small> / ${r.total} 組</small></span></button>`
      +`<div class="hbody" hidden>${rows}<button class="hdel" type="button">刪除這筆</button></div>`;
    const body=el.querySelector('.hbody');
    el.querySelector('.hhead').onclick=()=>{body.hidden=!body.hidden};
    const del=el.querySelector('.hdel');let armed=false;
    del.onclick=()=>{
      if(!armed){armed=true;del.textContent='再按一次確認刪除';return}
      history=history.filter(x=>x.id!==r.id);saveHistory();renderHistory();deleteSessionRemote(r.id);
    };
    list.appendChild(el);
  });
}
document.getElementById('hexport').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'w3',v:1,history},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='訓練紀錄-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  hmsg.textContent='已匯出 '+history.length+' 筆。';
};
document.getElementById('himport').onchange=ev=>{
  const f=ev.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const j=JSON.parse(rd.result);const arr=Array.isArray(j)?j:(j.history||[]);
      const ids=new Set(history.map(x=>x.id));let n=0;
      const added=[];
      arr.forEach(r=>{if(r&&r.id&&r.t&&Array.isArray(r.items)&&!ids.has(r.id)){history.push(r);added.push(r);n++}});
      saveHistory();renderHistory();added.forEach(pushSession);hmsg.textContent='匯入 '+n+' 筆新紀錄，重複的略過。';
    }catch(e){hmsg.textContent='檔案讀不出來，請確認是這個頁面匯出的備份檔。'}
    ev.target.value='';
  };
  rd.readAsText(f);
};

// rest timer
const timer=document.getElementById('timer'),tt=document.getElementById('tt'),bar=document.getElementById('bar');
let left=0,total=0,iv=null;
function render(){tt.textContent=fmt(left);bar.style.transform='scaleX('+(total?left/total:0)+')'}
function startTimer(sec){
  clearInterval(iv);left=sec;total=sec;timer.classList.add('on');render();
  iv=setInterval(()=>{left--;if(left<=0){stopTimer();if(navigator.vibrate)try{navigator.vibrate([200,100,200])}catch(e){}}else render()},1000);
}
function stopTimer(){clearInterval(iv);iv=null;timer.classList.remove('on')}
document.getElementById('t30').onclick=()=>{left+=30;total=Math.max(total,left);render()};
document.getElementById('tskip').onclick=stopTimer;


// ---------- 雲端同步（Supabase） ----------
const authEl=document.getElementById('auth');
let sb=null,user=null,syncState='off';
(function(){
  const c=window.SB_CONFIG||{};
  if(c.url&&c.key&&window.supabase){
    sb=window.supabase.createClient(c.url,c.key,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}});
  }
})();
function renderAuth(){
  if(!sb){authEl.hidden=true;return}
  authEl.hidden=false;
  if(!user){
    authEl.innerHTML=`<span class="dot"></span><span class="who">未登入，紀錄只存在這支手機</span>`
      +`<button type="button" data-p="google">Google 登入</button><button type="button" data-p="apple">Apple 登入</button>`;
    authEl.querySelectorAll('button').forEach(b=>b.onclick=()=>signIn(b.dataset.p));
  }else{
    const label={off:'',busy:'同步中',ok:'已同步',err:'同步失敗，稍後再試'}[syncState]||'';
    authEl.innerHTML=`<span class="dot ${syncState}"></span><span class="who"><b>${user.email||'已登入'}</b>${label?'，'+label:''}</span><button type="button" class="lnk" id="signout">登出</button>`;
    document.getElementById('signout').onclick=signOut;
  }
}
function setSync(s){syncState=s;renderAuth()}
async function signIn(provider){
  const redirectTo=location.origin+location.pathname;
  const {error}=await sb.auth.signInWithOAuth({provider,options:{redirectTo}});
  if(error){authEl.querySelector('.who').textContent='登入失敗：'+error.message}
}
async function signOut(){await sb.auth.signOut();user=null;renderAuth()}

// 兩套課表的重量與替代動作，打包成一份 prefs
function allPrefs(){
  const o={prog};
  for(const p in PROGRAMS){
    const k=PROGRAMS[p].key;let w={},sw={};
    try{w=JSON.parse(localStorage.getItem(k+'-w')||'{}')||{}}catch(e){}
    try{sw=JSON.parse(localStorage.getItem(k+'-swap')||'{}')||{}}catch(e){}
    o[p]={w,swap:sw};
  }
  return o;
}
function applyPrefs(remote){
  if(!remote)return;
  for(const p in PROGRAMS){
    const k=PROGRAMS[p].key;const r=remote[p]||{};
    let w={},sw={};
    try{w=JSON.parse(localStorage.getItem(k+'-w')||'{}')||{}}catch(e){}
    try{sw=JSON.parse(localStorage.getItem(k+'-swap')||'{}')||{}}catch(e){}
    // 遠端為底，本機蓋上去（本機通常比較新）
    try{localStorage.setItem(k+'-w',JSON.stringify(Object.assign({},r.w||{},w)))}catch(e){}
    try{localStorage.setItem(k+'-swap',JSON.stringify(Object.assign({},r.swap||{},sw)))}catch(e){}
  }
}
let prefsTimer=null;
function pushPrefs(){
  if(!sb||!user)return;
  clearTimeout(prefsTimer);
  prefsTimer=setTimeout(async()=>{
    setSync('busy');
    const {error}=await sb.from('prefs').upsert({user_id:user.id,data:allPrefs(),updated_at:new Date().toISOString()});
    setSync(error?'err':'ok');
  },800);
}
async function pushSession(rec){
  if(!sb||!user)return;
  setSync('busy');
  const {error}=await sb.from('sessions').upsert({id:rec.id,user_id:user.id,t:rec.t,data:rec});
  setSync(error?'err':'ok');
}
async function deleteSessionRemote(id){
  if(!sb||!user)return;
  setSync('busy');
  const {error}=await sb.from('sessions').delete().eq('user_id',user.id).eq('id',id);
  setSync(error?'err':'ok');
}
async function pullAll(){
  if(!sb||!user)return;
  setSync('busy');
  const [{data:rows,error:e1},{data:pref,error:e2}]=await Promise.all([
    sb.from('sessions').select('id,data').eq('user_id',user.id),
    sb.from('prefs').select('data').eq('user_id',user.id).maybeSingle(),
  ]);
  if(e1||e2){setSync('err');return}
  // 歷史：以 id 聯集，兩邊都保留
  const localIds=new Set(history.map(x=>x.id));
  const remoteIds=new Set();
  (rows||[]).forEach(r=>{remoteIds.add(Number(r.id));if(!localIds.has(Number(r.id))&&r.data)history.push(r.data)});
  saveHistory();
  const missing=history.filter(x=>!remoteIds.has(x.id));
  if(missing.length){
    await sb.from('sessions').upsert(missing.map(rec=>({id:rec.id,user_id:user.id,t:rec.t,data:rec})));
  }
  applyPrefs(pref&&pref.data);
  build();if(view==='hist')renderHistory();
  await sb.from('prefs').upsert({user_id:user.id,data:allPrefs(),updated_at:new Date().toISOString()});
  setSync('ok');
}
async function initAuth(){
  if(!sb){renderAuth();return}
  const {data:{session}}=await sb.auth.getSession();
  user=session?session.user:null;renderAuth();
  if(user)pullAll();
  sb.auth.onAuthStateChange((ev,s)=>{
    const u=s?s.user:null;
    const changed=(u&&u.id)!==(user&&user.id);
    user=u;renderAuth();
    if(changed&&u)pullAll();
  });
  // 清掉網址上的 OAuth 參數
  if(location.search||location.hash)history_replace();
}
function history_replace(){try{window.history.replaceState({},'',location.pathname)}catch(e){}}

build();renderView();initAuth();
</script>
