name: WorkoutWatch
options:
  bundleIdPrefix: com.jsdryan.gymplan
  deploymentTarget:
    watchOS: "11.0"
settings:
  base:
    DEVELOPMENT_TEAM: Y2PBXKV39D
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WorkoutWatch:
    type: application
    platform: watchOS
    sources: [WorkoutWatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jsdryan.gymplan.watch
        PRODUCT_NAME: WorkoutWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 健身課表
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_WKApplication: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHealthShareUsageDescription: 讀取心率、消耗熱量與步數，顯示在體能訓練紀錄和錶面小工具上。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: 把每次重訓存成 Apple「體能訓練」，並讓 App 在螢幕變暗時也能震動提醒休息結束。
    info:
      path: WorkoutWatch/Info.plist
      properties:
        WKBackgroundModes: [workout-processing]
    entitlements:
      path: WorkoutWatch/WorkoutWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.jsdryan.gymplan]
        com.apple.developer.healthkit.background-delivery: true
    dependencies:
      - target: StepsWidget
  StepsWidget:
    type: app-extension
    platform: watchOS
    sources: [StepsWidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jsdryan.gymplan.watch.steps
        PRODUCT_NAME: StepsWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 今天步數
        INFOPLIST_KEY_NSHealthShareUsageDescription: 讀取今天的步數，顯示在錶面小工具上。
    info:
      path: StepsWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: StepsWidget/StepsWidget.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.jsdryan.gymplan]
